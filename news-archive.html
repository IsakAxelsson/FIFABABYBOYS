<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA BABYBOYS – Nyhetsarkivet</title>
<style>
:root{font-family:Georgia,serif;color:#201914;background:#111a35}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1050px;margin:auto}.back{color:#fff;font:700 15px system-ui;text-decoration:none}.mast{color:#fff;text-align:center;font:900 clamp(32px,6vw,70px) Impact,sans-serif;margin:24px 0 4px}.sub{color:#f0d4a2;text-align:center;font:16px system-ui;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}.paper{background:#f5e5c6;border:5px double #725139;box-shadow:8px 8px 0 #0005;padding:20px;min-width:0}.paper h2{font:900 29px/1.1 Impact,sans-serif;text-transform:uppercase;border-bottom:4px solid #b6201c;padding-bottom:12px;overflow-wrap:anywhere}.paper img{width:100%;max-height:450px;object-fit:contain;background:#e9d4b4;cursor:zoom-in}.paper p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.date{font:12px system-ui;color:#735c45}.status{color:white;text-align:center;font:16px system-ui}.more{display:block;margin:25px auto;padding:12px 24px;border:0;background:#d21f22;color:white;font:700 16px system-ui;cursor:pointer}.more[hidden]{display:none}dialog{background:#111;border:0;padding:12px;max-width:95vw;max-height:95vh}dialog img{max-width:90vw;max-height:80vh;object-fit:contain}dialog button{display:block;margin-left:auto;margin-bottom:8px} @media(max-width:500px){body{padding:12px}}
</style>
</head>
<body><main><a class="back" href="/">← Tillbaka till FIFA BABYBOYS</a><h1 class="mast">BREAKING NEWS</h1><div class="sub">NYHETSARKIVET · Tidigare avslöjanden</div><div id="status" class="status" role="status">Hämtar publicerade nyheter…</div><section id="articles" class="grid" aria-label="Publicerade nyheter"></section><button id="more" class="more" hidden>Visa fler artiklar</button></main><dialog id="zoom"><button id="close" aria-label="Stäng bild">Stäng ✕</button><img id="large" alt="Förstorad nyhetsbild"></dialog>
<script>
(()=>{'use strict';const status=document.getElementById('status'),grid=document.getElementById('articles'),more=document.getElementById('more'),zoom=document.getElementById('zoom'),large=document.getElementById('large');let page=0,busy=false;function node(tag,cls,content){const el=document.createElement(tag);if(cls)el.className=cls;if(content!=null)el.textContent=content;return el}async function load(){if(busy)return;busy=true;more.hidden=true;try{const response=await fetch('/api/news-archive?page='+page,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.articles))throw Error('Ogiltigt serversvar');for(const item of data.articles){const card=node('article','paper');card.append(node('div','date',item.publishedAt?new Date(item.publishedAt).toLocaleString('sv-SE'):'PUBLICERAD'),node('h2','',item.headline||'EXTRA!'));if(item.imageUrl){const img=node('img');img.src=item.imageUrl;img.alt='Bild till '+(item.headline||'nyhet');img.loading='lazy';img.onclick=()=>{large.src=img.src;zoom.showModal()};card.append(img)}if(item.article)card.append(node('p','',item.article));grid.append(card)}page++;status.textContent=grid.children.length?'': 'Inga publicerade artiklar ännu.';more.hidden=!data.hasMore}catch(error){status.textContent='Kunde inte hämta arkivet. Försök igen senare.';console.error(error)}finally{busy=false}}more.onclick=load;document.getElementById('close').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close()};load()})();
</script></body></html>
